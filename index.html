<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社交偵探 2.0：心動定係感動？</title>
    <style>
        body { font-family: 'Microsoft JhengHei', sans-serif; background-color: #fdf2f2; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        h1 { color: #2c3e50; }
        .game-container { display: flex; justify-content: space-around; width: 100%; max-width: 850px; margin-top: 20px; }
        .bin { width: 350px; height: 220px; border: 4px dashed #bdc3c7; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: white; transition: all 0.3s; }
        .bin#friendship { border-color: #3498db; color: #3498db; }
        .bin#love { border-color: #e74c3c; color: #e74c3c; }
        .bin.hover { transform: scale(1.05); background-color: #f9f9f9; }
        #card-container { margin-top: 40px; height: 160px; display: flex; justify-content: center; align-items: center; width: 100%; }
        .card { width: 320px; padding: 25px; background-color: #fff; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); cursor: grab; text-align: center; font-size: 1.4em; font-weight: bold; border: 3px solid #34495e; touch-action: none; }
        #score-board { margin-top: 20px; font-size: 1.2em; }
        #message { margin-top: 10px; height: 30px; font-size: 1.2em; font-weight: bold; }
        .correct { color: #27ae60; }
        .wrong { color: #e74c3c; }
        button { margin-top: 20px; padding: 10px 20px; cursor: pointer; background: #34495e; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>

    <h1>社交偵探 2.0：友情 vs 愛情</h1>
    <p>請將情境牌拉入正確的籃子！</p>

    <div class="game-container">
        <div id="friendship" class="bin" ondrop="drop(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)">
            <h2>友情 👬</h2>
            <p>（大眾、輕鬆、無壓力）</p>
        </div>
        <div id="love" class="bin" ondrop="drop(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)">
            <h2>愛情 💖</h2>
            <p>（唯一、心跳、排他性）</p>
        </div>
    </div>

    <div id="card-container">
        <div id="current-card" class="card" draggable="true" ondragstart="drag(event)">載入中...</div>
    </div>

    <div id="message"></div>
    <div id="score-board">進度: <span id="total">0</span> / 20 | 分數: <span id="score">0</span></div>
    <button onclick="resetGame()">重新開始遊戲</button>

    <script>
        const scenarios = [
            // 原有例子
            { text: "一班人一齊打機、食飯", type: "friendship" },
            { text: "單獨約會，而且好想牽對方手", type: "love" },
            { text: "見到對方同其他人玩會好酸、好妒忌", type: "love" },
            { text: "對方唔開心，我會安慰佢", type: "friendship" },
            { text: "會同佢分享心事，但佢同邊個玩我唔介意", type: "friendship" },
            { text: "想每一分每一秒都見到佢，唔想有第三者", type: "love" },
            { text: "放假想一大班同學去迪士尼", type: "friendship" },
            { text: "見到佢會面紅耳赤，心跳加速", type: "love" },
            // 新增 12 個例子
            { text: "喺 WhatsApp 群組同大家一齊傾功課", type: "friendship" },
            { text: "對方傳訊息嚟，我有禮貌咁覆返佢", type: "friendship" },
            { text: "見到同學病咗，喺群組問候一句", type: "friendship" },
            { text: "因為大家都鍾意同一個星，一齊去買海報", type: "friendship" },
            { text: "大方咁借文具俾對方，唔會覺得尷尬", type: "friendship" },
            { text: "同對方講嘢嗰陣，保持一個手臂嘅距離", type: "friendship" },
            { text: "每日起身第一件事就係睇對方 IG 嘅新 Post", type: "love" },
            { text: "想佢淨係陪我一個，唔想佢同其他異性玩", type: "love" },
            { text: "每晚都要同佢傾電話傾到凌晨，唔捨得收線", type: "love" },
            { text: "好想藉故摸下對方嘅頭髮或者拍下佢手背", type: "love" },
            { text: "親手整咗份精緻禮物，淨係送俾佢一個", type: "love" },
            { text: "上緊堂嗰陣，個腦成日諗起對方個樣", type: "love" }
        ];

        let currentCardIndex = 0;
        let score = 0;
        let gameScenarios = [];

        function shuffle(array) { return array.sort(() => Math.random() - 0.5); }

        function displayNextCard() {
            if (currentCardIndex < gameScenarios.length) {
                const card = document.getElementById('current-card');
                card.innerText = gameScenarios[currentCardIndex].text;
                card.style.display = 'block';
                document.getElementById('message').innerText = "";
            } else {
                document.getElementById('current-card').style.display = 'none';
                document.getElementById('message').innerHTML = "<span class='correct'>恭喜！你已完成所有社交偵探任務！</span>";
            }
        }

        function allowDrop(ev) { ev.preventDefault(); ev.target.closest('.bin').classList.add('hover'); }
        function dragLeave(ev) { ev.target.closest('.bin').classList.remove('hover'); }
        function drag(ev) { ev.dataTransfer.setData("text", ev.target.id); }

        function drop(ev) {
            ev.preventDefault();
            const bin = ev.target.closest('.bin');
            bin.classList.remove('hover');
            const binId = bin.id;
            const correctAnswer = gameScenarios[currentCardIndex].type;

            if (binId === correctAnswer) {
                score++;
                document.getElementById('message').innerHTML = "<span class='correct'>答對了！✅</span>";
            } else {
                document.getElementById('message').innerHTML = "<span class='wrong'>再想一想，呢個行為更接近邊種關係？❌</span>";
            }

            currentCardIndex++;
            document.getElementById('score').innerText = score;
            document.getElementById('total').innerText = currentCardIndex;
            setTimeout(displayNextCard, 1000);
        }

        function resetGame() {
            score = 0; currentCardIndex = 0;
            gameScenarios = shuffle([...scenarios]);
            document.getElementById('score').innerText = "0";
            document.getElementById('total').innerText = "0";
            displayNextCard();
        }

        resetGame();
    </script>
</body>
</html>
